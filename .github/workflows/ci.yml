name: NexusAI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax of all backend files
        run: |
          set -e
          echo "🔍 Checking server.js..."
          node --check server.js
          echo "🔍 Checking services/..."
          for f in services/*.js; do node --check "$f"; done
          echo "🔍 Checking security/..."
          for f in security/*.js; do node --check "$f"; done
          echo "🔍 Checking routes/..."
          for f in routes/*.js; do node --check "$f"; done
          echo "🔍 Checking router/..."
          for f in router/*.js; do node --check "$f"; done
          echo "🔍 Checking queues/..."
          for f in queues/*.js; do node --check "$f"; done
          echo "🔍 Checking workers/..."
          for f in workers/*.js; do node --check "$f"; done
          echo "🔍 Checking realtime/..."
          for f in realtime/*.js; do node --check "$f"; done
          echo "🔍 Checking monitoring/..."
          for f in monitoring/*.js; do node --check "$f"; done
          echo "🔍 Checking resilience/..."
          for f in resilience/*.js; do node --check "$f"; done
          echo "🔍 Checking agents/..."
          for f in agents/*.js; do node --check "$f"; done
          echo "✅ All files parse cleanly"

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (strict mode)
        run: npx tsc --noEmit
      - name: Build
        run: npx tsc

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build TypeScript
        run: npx tsc
      - name: Run unit tests
        run: node tests/unit.js

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build TypeScript
        run: npx tsc
      - name: Run integration tests
        run: node tests/integration-mock.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-do-not-use-in-prod
          DEPLOY_KEY: test-deploy-key-32-chars-1234567890

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high