name: NexusAI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Every server file lives under backend/. The previous version ran
      # `node --check server.js` from the checkout root, where no such
      # file exists, so the job failed with MODULE_NOT_FOUND before
      # checking anything.
      #
      # Paths are discovered rather than listed, so adding a directory
      # under backend/ does not silently go unchecked. `-print0` and
      # `read -r -d ''` keep it correct if a path ever contains a space.
      - name: Check syntax of all backend files
        run: |
          set -euo pipefail
          test -d backend || { echo "backend/ not found at $(pwd)"; exit 1; }
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find backend -type f -name '*.js' \
                     -not -path '*/node_modules/*' \
                     -not -path '*/dist/*' \
                     -print0)
          echo "$count backend file(s) parse cleanly"
          test "$count" -gt 0 || { echo "no .js files found under backend/"; exit 1; }

      # tests/ sits at the repository root, not under backend/.
      - name: Check syntax of test files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find tests -type f -name '*.js' -not -path '*/node_modules/*' -print0)
          echo "test files parse cleanly"

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # The root package.json and tsconfig.json cover the whole project;
      # tsconfig's include is already backend/**/*.ts.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (strict mode)
        run: npx tsc --noEmit
      - name: Build
        run: npx tsc

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build TypeScript
        run: npx tsc
      # The file in the repository is tests/units.js. The workflow asked
      # for tests/unit.js, which does not exist.
      - name: Run unit tests
        run: node tests/units.js

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build TypeScript
        run: npx tsc
      - name: Run integration tests
        run: node tests/integration-mock.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-do-not-use-in-prod
          DEPLOY_KEY: test-deploy-key-32-chars-1234567890

  # Mirrors what Railway does: Root Directory is backend, so it installs
  # from backend/package-lock.json with npm ci. Catching a lockfile drift
  # here means finding it in CI rather than in a failed deployment.
  backend-install:
    name: Backend Lockfile (Railway parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci in backend
        working-directory: backend
        run: npm ci --no-audit --no-fund

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high