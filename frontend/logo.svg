<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="NexusAI">
  <defs>
    <linearGradient id="nx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6f135"/>
      <stop offset="50%" stop-color="#35f1c6"/>
      <stop offset="100%" stop-color="#5b8def"/>
    </linearGradient>
    <radialGradient id="nx-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#35f1c6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#35f1c6" stop-opacity="0"/>
    </radialGradient>
    <filter id="nx-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#nx-grad)" stroke-width="1" opacity=".4"/>
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#nx-grad)" stroke-width="1.2" opacity=".6" transform="rotate(-30 50 50)"/>
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#nx-grad)" stroke-width="1.2" opacity=".6" transform="rotate(30 50 50)"/>
  <g filter="url(#nx-glow)">
    <circle cx="50" cy="8"  r="2.2" fill="#c6f135"/>
    <circle cx="86" cy="42" r="2.2" fill="#35f1c6"/>
    <circle cx="72" cy="78" r="2.2" fill="#5b8def"/>
    <circle cx="28" cy="78" r="2.2" fill="#35f1c6"/>
    <circle cx="14" cy="42" r="2.2" fill="#c6f135"/>
  </g>
  <g stroke="url(#nx-grad)" stroke-width=".8" opacity=".55" fill="none" stroke-linecap="round">
    <path d="M50 8 L86 42 L72 78 L28 78 L14 42 Z"/>
    <path d="M50 8 L72 78"/>
    <path d="M50 8 L28 78"/>
    <path d="M86 42 L14 42"/>
    <path d="M86 42 L28 78"/>
    <path d="M14 42 L72 78"/>
  </g>
  <circle cx="50" cy="50" r="10" fill="url(#nx-core)" opacity=".9"/>
  <circle cx="50" cy="50" r="3" fill="#fff" filter="url(#nx-glow)">
    <animate attributeName="r" values="2.5;3.5;2.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;1;.8" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>